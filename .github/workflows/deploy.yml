name: Build and Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Verify build-time defines were substituted
        run: |
          if grep -rlE '__SW_VERSION__|__BUILD_STAMP__' dist/; then
            echo "::error::Found unsubstituted build-time placeholder (__SW_VERSION__/__BUILD_STAMP__) in the production bundle. The Vite/Rolldown define substitution is not being applied — see issue #136."
            exit 1
          fi
          echo "OK: no unsubstituted build-time placeholders found in dist/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
